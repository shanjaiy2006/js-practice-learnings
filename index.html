<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 1 - DOM Basics</title>
  </head>
  <body>
    <h1>Level 1: DOM Practice</h1>

    <!-- Task 1: Change text -->
    <h2 id="heading">Original Heading</h2>
    <button id="changeTextBtn">Change Text</button>

    <!-- Task 2: Change HTML content -->
    <div id="htmlBox">Original HTML content</div>
    <button id="changeHTMLBtn">Change HTML</button>

    <!-- Task 3: Read input value -->
    <input id="nameInput" placeholder="Enter your name" />
    <button id="greetBtn">Greet Me</button>
    <p id="greeting"></p>

    <!-- Task 4: Button click counter -->
    <p>Clicks: <span id="count">0</span></p>
    <button id="countBtn">Click Me</button>

    <!-- Task 5: Show and hide -->
    <p id="hideText">You can hide and show this text!</p>
    <button id="toggleTextBtn">Hide / Show</button>

    <!-- Task 6: Change background color -->
    <p id="colorBox">Change my background color!</p>
    <button id="colorBtn">Change Color</button>

    <!-- Task 7: Change font size -->
    <p id="fontText">Make this text bigger!</p>
    <button id="fontBtn">Increase Font Size</button>

    <!-- Task 8: Update image -->
    <img
      id="myImage"
      src="https://placehold.co/200x100?text=Image+One"
      alt="Placeholder image"
    />
    <br />
    <button id="imageBtn">Change Image</button>

    <!-- Task 9: Change attributes -->
    <a id="myLink" href="https://example.com" target="_blank"> Example Link </a>
    <br />
    <button id="linkBtn">Change Link</button>

    <!-- Task 10: Select elements -->
    <p class="item">Item 1</p>
    <p class="item">Item 2</p>
    <p class="item">Item 3</p>
    <button id="selectBtn">Select All Items</button>

    <script src="./script.js"></script>
  </body>
</html>
